  - agent test-run-for-commit --project="{org}/{proj}"
  - agent test-runs
  - agent test-runs --prNumber=123
  - agent test-runs --baseTestRuns
  - agent test-runs --latestPerPullRequest
  - agent test-runs --status=Running,Scheduled
