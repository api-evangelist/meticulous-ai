install:
- method: npm global install
  command: npm install --global @alwaysmeticulous/cli@latest
- method: npm global install (alternative syntax)
  command: npm install -g @alwaysmeticulous/cli
- method: npx (no install)
  command: npx @alwaysmeticulous/cli [command]
commands:
- group: auth
  commands:
  - auth login
  - auth login --non-interactive --project="{org}/{proj}"
