  - agent test-runs --withCheckIssuesOnly
  - agent test-runs --checkIds=accessibility
  - agent test-runs --createdSince="2026-09-01"
  - agent test-runs --includeBaseTestRunId
  - agent test-runs --includeDiffCount
  - agent test-runs --includeCheckIssueCounts
  - agent test-runs --includeDurationSeconds
  - agent test-runs --project="{org}/{proj}"
  - agent test-runs --limit=25 --offset=50
  - agent test-run-diffs
  - agent test-run-diffs --testRunId="<id>"
  - agent test-run-diffs --commitSha="<sha>"
  - agent test-run-diffs --prNumber=123
  - agent trigger-test-run
  - agent trigger-test-run --deploymentId="<id>"
  - agent trigger-test-run --project="{org}/{proj}"
  - agent trigger-test-run --deploymentId="<id>" --baseSha="<sha>"
  - agent trigger-test-run --deploymentId="<id>" --baseSha="<sha>" --gitDiffOutput="<diff>"
  - agent trigger-test-run --commitSha="<sha>"
  - agent trigger-test-run --sessionIds="<id1>,<id2>"
