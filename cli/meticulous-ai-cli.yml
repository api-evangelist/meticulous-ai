  - auth whoami
  - auth logout
  - auth get-project
  - auth set-project
  - auth set-project --project="{org}/{proj}"
  - auth list-projects
- group: agent
  commands:
  - agent test-run-for-commit
  - agent test-run-for-commit --commitSha="<sha>"
  - agent test-run-for-commit --prNumber=123
